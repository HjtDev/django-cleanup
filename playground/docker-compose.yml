# Phase 7 playground — docs/APP-DESIGN.md §11.2. Postgres, Redis (for the celery extra path),
# both halves wired by PATH (not by tag), and a celery worker sharing the SAME media volume as
# the backend — a named volume, not a bind mount, so both containers see one real disk.
#
# Run from the REPO ROOT, not from playground/, so the build context can see both this app's own
# working tree and the playground consumer at once:
#   docker compose -f playground/docker-compose.yml up -d --wait

name: cleanup-app-playground

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["55435:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["63793:6379"]

  backend:
    build:
      context: ..
      dockerfile: playground/backend/Dockerfile
    environment: &backend_env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000"
      CLEANUP_USE_CELERY: ${CLEANUP_USE_CELERY:-false}
    volumes:
      - media:/app/playground/backend/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports: ["8000:8000"]

  # Shares the backend's own image and the SAME named media volume — without that second part,
  # a run triggered through this worker would report success while the backend's own view of
  # disk still showed the "deleted" files untouched (two different filesystems).
  worker:
    build:
      context: ..
      dockerfile: playground/backend/Dockerfile
    command: celery -A config worker --loglevel=info
    environment: *backend_env
    volumes:
      - media:/app/playground/backend/media
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ..
      dockerfile: playground/frontend/Dockerfile
    environment:
      CLEANUP_BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  media:
